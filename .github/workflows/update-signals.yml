name: Update KRX signals
on:
  schedule:
    - cron: "*/5 * * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update-signals
  cancel-in-progress: true
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan OpenDART
        env:
          OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
        run: python scanner.py
      - name: Publish fresh data
        run: |
          git config user.name "signal-catch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add signals.json
          git diff --cached --quiet || git commit -m "Update KRX signals"
          git push
